apiVersion: apps/v1
kind: Deployment
metadata:
  name: dismist
  labels:
    app.kubernetes.io/name: dismist
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dismist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dismist
    spec:
      # AP identity is selected by the source IP seen by this process.
      # Direct node routing avoids a load balancer or kube-proxy source NAT.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        dismist.io/controller: "true"
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-private-files
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - |
              chown 65532:65532 /state /private
              chmod 0700 /state /private
              for file in /bootstrap/*; do
                [ -f "$file" ] || continue
                cp -L "$file" "/private/${file##*/}"
              done
              chown 65532:65532 /private/*
              chmod 0600 /private/*
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: private
              mountPath: /private
      containers:
        - name: dismistd
          image: registry.example.invalid/dismist:REPLACE_ME
          imagePullPolicy: IfNotPresent
          args:
            - -controller-ip=$(NODE_IP)
            - -db=/state/controller.db
            - -ap-config=/private/ap-config.json
            - -tls-cert=/private/tls.crt
            - -tls-key=/private/tls.key
            - -admin-token-file=/private/admin.token
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: ap-dns-udp
              containerPort: 53
              protocol: UDP
            - name: ap-dns-tcp
              containerPort: 53
              protocol: TCP
            - name: ap-wss
              containerPort: 443
              protocol: TCP
            - name: ui
              containerPort: 8088
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: ui
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: ui
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: ui
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: private
              mountPath: /private
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: dismist-state
        - name: bootstrap
          secret:
            secretName: dismist-private
        - name: private
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
