{{- if .Values.metrics.networkPolicy.enabled }}
# Rule 1 keeps the UI, AP WSS and AP DNS ports open with no `from`: the
# Gateway can reach pods as an identity a NetworkPolicy peer cannot name, and
# APs arrive from anywhere. Rule 2 opens the metrics port to `from` only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dismist.fullname" . }}
  labels:
    {{- include "dismist.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dismist.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: ui
          protocol: TCP
        - port: ap-wss
          protocol: TCP
        - port: ap-dns-udp
          protocol: UDP
        - port: ap-dns-tcp
          protocol: TCP
    {{- if include "dismist.metricsExposed" . }}
    - from:
        {{- toYaml .Values.metrics.networkPolicy.from | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
{{- end }}
