# Dismist runs as a single controller: one replica, Recreate upgrades, one
# ReadWriteOnce volume for its bbolt database. Never scale it above one.

image:
  repository: ghcr.io/nicko170/dismist
  # Defaults to the chart's appVersion.
  tag: ""
  # Optional sha256 digest; when set it pins the image and the tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Secret holding the controller's private files. Required. Expected keys:
#   admin.token   64-character UI administrator token (dismist init writes one)
#   tls.crt/key   the AP WSS certificate and key, unless tls.secretName or
#                 tls.certificate supplies them
# AP EEPROM secrets live in the database: paste or upload each AP's secret
# when you register it in the UI or API. (A <name>.bin key is only needed for
# an old AP record that still points at /private/<name>.bin; dismistd imports
# that file into the database once at startup.)
# An init container copies the keys to a memory volume at /private, owned by
# the daemon user with mode 0600, because dismistd rejects readable secrets.
# Restart the pod after changing the Secret.
privateSecret:
  name: ""

# The certificate APs see on the WSS endpoint. AP authentication is bound to
# it, so TLS must end at dismistd: never put an AP-facing TLS proxy in front.
# A public certificate (for example Let's Encrypt) works once the AP's
# cloud.ini points at its hostname and its CA bundle includes that root.
tls:
  # Existing kubernetes.io/tls Secret, mounted directly. dismistd checks it
  # every minute and restarts itself to serve a renewed certificate.
  secretName: ""
  # Or let cert-manager issue one into <fullname>-ap-tls (or secretName).
  certificate:
    enabled: false
    dnsNames: []
    issuerRef:
      kind: ClusterIssuer
      name: ""
    privateKey:
      algorithm: ECDSA
      size: 256
      rotationPolicy: Always

controller:
  # IPv4 address dismist's AP DNS returns for ep-terminator.mistsys.net.
  # Only APs still using the stock endpoint name need it. Defaults to the
  # node IP with hostNetwork, otherwise the pod IP.
  advertisedIP: ""
  # DNS name operators use for the UI (the Host header the UI accepts).
  uiHost: ""
  # CIDRs of reverse proxies (an ingress or Gateway) whose X-Forwarded-Proto
  # header the UI trusts. Needed for sign-in behind an HTTPS proxy: set it to
  # the proxy's source range, for example the cluster pod CIDRs.
  trustedProxies: []
  # Resolver for the APs' other DNS questions.
  upstreamDNS: 1.1.1.1:53
  # Server name in the AP authentication reply. Empty keeps dismistd's default.
  serverName: ""
  # Key in privateSecret holding a custom AP config template. Empty uses the
  # bundled AP33 template.
  apConfigKey: ""
  # Deprecated: use metrics.*. Overrides the loopback metrics listen address
  # (default 127.0.0.1:<metrics.port>) while metrics are not exposed; an
  # empty string disables metrics. Ignored once metrics.service,
  # metrics.serviceMonitor or monitoring.enabled exposes them.
  metricsListen: null
  extraArgs: []

# Container listen ports. The AP Service maps 443 (and 53 if exposed) onto
# these, so the daemon needs no privileged ports. With hostNetwork the APs
# connect to these ports directly. The daemon runs unprivileged, so binding
# 443 or 53 there needs the node's net.ipv4.ip_unprivileged_port_start
# lowered; otherwise put the port in the AP's cloud.ini URL
# (wss://host:8443/ws).
listen:
  ui: 8088
  wss: 8443
  dns: 5353

# Bind straight to the node's network instead of using the AP Service. APs
# then reach the node IP, and their source address is seen unchanged.
hostNetwork: false

# Operator UI and API (plain HTTP; publish it through httpRoute or your own
# HTTPS proxy).
service:
  type: ClusterIP
  port: 8088
  annotations: {}

# The AP-facing endpoint: WSS on TCP 443, plus AP DNS on UDP/TCP 53 if
# exposeDNS is set (only for APs still resolving ep-terminator.mistsys.net
# through dismist). Dismist identifies each AP by the ID it authenticates
# with, so any number of APs can share one NAT address. externalTrafficPolicy
# Local keeps each AP's real source address, which dismist shows as the AP's
# public address, checks against an AP record's optional source pin
# (management IP), and uses to answer AP DNS only for registered APs.
apService:
  enabled: true
  type: LoadBalancer
  annotations: {}
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Local
  loadBalancerSourceRanges: []
  exposeDNS: false
  ports:
    wss: 443
    dns: 53

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  annotations: {}

# Gateway API HTTPRoute for the UI. Server-sent events stream for up to 30
# minutes, so disable or raise the proxy's request timeout.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: public
  #    namespace: gateway
  #    sectionName: https-dismist
  hostnames: []
  timeouts:
    request: "0s"
  filters: []

initImage:
  repository: busybox
  tag: 1.37.0
  pullPolicy: IfNotPresent

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # No fsGroup: kubelet would add group read/write to controller.db on every
  # pod start, and dismistd refuses a database that isn't private.
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

# Prometheus metrics, alerts and Grafana dashboards.
#
# One switch ships the scrape Service, ServiceMonitor, PrometheusRule and
# dashboard ConfigMap (the last two once the chart carries rules and
# dashboards). Each part below also has its own `enabled`: null follows this
# switch, true or false overrides it. The ServiceMonitor and PrometheusRule
# need the Prometheus Operator CRDs (monitoring.coreos.com).
monitoring:
  enabled: false

metrics:
  # Serve /metrics. While nothing exposes it, dismistd listens on the pod's
  # loopback only (127.0.0.1:<port>). Exposing it (service, serviceMonitor or
  # scrapeAnnotations) makes dismistd listen on :<port>, all addresses.
  enabled: true
  port: 9090
  # Add site, AP and WLAN names as a `name` label on *_info series
  # (-metrics-names). Off: series carry IDs only.
  includeNames: false
  # Client series: off, aggregate or per-client (per-client exports client
  # MACs) (-metrics-clients), and the per-client cap (-metrics-client-limit).
  clients: aggregate
  clientLimit: 100
  # Require a bearer token on every scrape: the name of a Secret in the
  # release namespace and the key holding the token (at least 16 characters,
  # for example `openssl rand -hex 32`). dismistd reads it at startup and the
  # ServiceMonitor sends it. Empty: no token.
  auth:
    existingSecret: ""
    key: token
  # With hostNetwork, exposing metrics would publish them on the node's
  # addresses; the chart refuses unless this is true.
  allowHostNetwork: false
  # Add prometheus.io/scrape, port and path pod annotations for a Prometheus
  # without the Operator. Exposes the listener like the Service does.
  scrapeAnnotations: false
  # ClusterIP Service <fullname>-metrics. null follows monitoring.enabled;
  # the ServiceMonitor turns it on too.
  service:
    enabled: null
    port: 9090
    annotations: {}
  serviceMonitor:
    enabled: null
    # Extra labels, if your Prometheus selects ServiceMonitors by label (for
    # example release: <kube-prometheus-stack release>).
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    # Fail the scrape past this many samples (0: no limit).
    sampleLimit: 0
    # Set instance=<fullname> on every series, so AP series stay one series
    # across pod restarts (the chart always runs one replica).
    stableInstance: true
    relabelings: []
    metricRelabelings: []
  prometheusRule:
    enabled: null
    labels: {}
    # Alert names to leave out, for example [DismistAPFlapping].
    disabledAlerts: []
    # Alert name to severity, for example {DismistAPSilent: info}.
    severityOverrides: {}
    # Extra rule groups appended as is.
    extraGroups: []
  dashboards:
    enabled: null
    # Namespace for the dashboard ConfigMap; empty: the release namespace.
    # The Grafana sidecar must watch it.
    namespace: ""
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    folder: Dismist
    annotations: {}
  # NetworkPolicy for the dismist pod: the UI, WSS and DNS ports stay open to
  # everyone (the Gateway and the AP load balancer need them), and the
  # metrics port only to `from`. Off by default.
  networkPolicy:
    enabled: false
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus

backup:
  # Size limit of the /tmp emptyDir where a backup download is staged
  # (GET /api/system/backup copies the database there, then streams it).
  # Keep it above the database size.
  tmpSizeLimit: 1Gi

probes:
  # The startup probe checks /healthz every 5 s; this many failures (60 = 5
  # minutes) cover a slow first start, such as a database migration.
  startupFailureThreshold: 60
  # The readiness probe path. /readyz answers 200 once the database works,
  # the AP WSS listener is bound and any migration has finished, so the AP
  # Service only sends APs to a pod that can serve them.
  readinessPath: /readyz

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
