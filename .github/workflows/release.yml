name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test Go packages
        run: go test ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            for command in dismist dismistd; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -mod=readonly -trimpath -buildvcs=false \
                -ldflags='-buildid=' \
                -o "dist/${command}-${os}-${arch}" "./cmd/${command}"
            done
          done

      - name: Package platform archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            stage="staging/${os}-${arch}"
            mkdir -p "$stage/juniper/tools" "$stage/docs" "$stage/ops/kubernetes"
            cp "dist/dismist-${os}-${arch}" "$stage/dismist"
            cp "dist/dismistd-${os}-${arch}" "$stage/dismistd"
            cp README.md LICENSE prepare_rw_overlay.py "$stage/"
            cp juniper/AP33.md "$stage/juniper/"
            cp juniper/tools/serial_response.py "$stage/juniper/tools/"
            cp docs/{deployment,onboarding,sites-and-history,config-surface,kubernetes}.md "$stage/docs/"
            cp ops/dismistd.service "$stage/ops/"
            cp ops/kubernetes/* "$stage/ops/kubernetes/"
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -C "$stage" -cf - . | gzip -n > "dist/dismist-${os}-${arch}.tar.gz"
          done
          (cd dist && sha256sum dismist-* dismistd-* > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
