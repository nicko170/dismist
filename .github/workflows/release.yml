name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            ui/package-lock.json

      - name: Build embedded legacy UI
        working-directory: web
        run: |
          npm ci
          npm run build

      # Only a stub of ui/dist is committed: the release binaries must embed a
      # real build.
      - name: Build embedded UI
        working-directory: ui
        run: |
          npm ci
          scripts/ensure-native-typescript.sh
          npm run build
          test -s dist/index.html
          if grep -q 'UI not built' dist/index.html; then
            echo "::error::ui/dist/index.html is still the stub"; exit 1
          fi
          if [ -z "$(find dist/_ui -type f ! -name .keep | head -n 1)" ]; then
            echo "::error::ui/dist/_ui has no assets"; exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test Go packages
        run: go test ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            for command in dismist dismistd; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -mod=readonly -trimpath -buildvcs=false \
                -ldflags='-buildid=' \
                -o "dist/${command}-${os}-${arch}" "./cmd/${command}"
            done
          done

      - name: Package platform archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            stage="staging/${os}-${arch}"
            mkdir -p "$stage/docs/juniper/tools" "$stage/docs/juniper/images" "$stage/ops"
            cp "dist/dismist-${os}-${arch}" "$stage/dismist"
            cp "dist/dismistd-${os}-${arch}" "$stage/dismistd"
            cp README.md LICENSE prepare_rw_overlay.py "$stage/"
            cp docs/juniper/AP33.md "$stage/docs/juniper/"
            cp docs/juniper/tools/serial_response.py "$stage/docs/juniper/tools/"
            cp docs/juniper/images/ap33-uart.png "$stage/docs/juniper/images/"
            cp docs/{deployment,onboarding,sites-and-history,config-surface,kubernetes}.md "$stage/docs/"
            cp ops/dismistd.service "$stage/ops/"
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -C "$stage" -cf - . | gzip -n > "dist/dismist-${os}-${arch}.tar.gz"
          done
          (cd dist && sha256sum dismist-* dismistd-* > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  image:
    # Only publish an image for a tag whose tests passed.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dismist
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    # Publish the chart only once the image it points at exists.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Package and push Helm chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          owner="${OWNER,,}"
          helm lint charts/dismist --set privateSecret.name=lint
          helm package charts/dismist --version "$version" --app-version "$version" --destination dist
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/dismist-${version}.tgz" "oci://ghcr.io/${owner}/charts"
