name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test Go packages
        run: go test ./...

      - name: Lint and render Helm chart
        run: |
          helm lint charts/dismist --set privateSecret.name=lint
          helm template dismist charts/dismist --set privateSecret.name=lint > /dev/null
          helm template dismist charts/dismist --set privateSecret.name=lint \
            --set tls.certificate.enabled=true --set 'tls.certificate.dnsNames[0]=ap.example.com' \
            --set tls.certificate.issuerRef.name=letsencrypt --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=gw' --set 'httpRoute.hostnames[0]=dismist.example.com' > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
